<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>照片查看器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__left">
        <h1 class="title">照片查看器</h1>
        <p class="subtitle">上传图片后，会在本页面网格展示（由后端保存到本地 `uploads/` 目录）。</p>
      </div>
      <div class="topbar__right">
        <label class="btn btn--primary" for="fileInput">选择图片</label>
        <input id="fileInput" type="file" accept="image/*" multiple />
        <button id="clearBtn" class="btn btn--danger" type="button">清空所有照片</button>
      </div>
    </header>

    <main class="container">
      <div id="status" class="status" aria-live="polite"></div>
      <div id="grid" class="grid" aria-label="照片网格"></div>
    </main>

    <!-- 简易内页查看器 -->
    <div id="modalOverlay" class="modalOverlay" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-label="查看照片">
        <div class="modal__top">
          <div class="modal__caption" id="modalCaption">—</div>
          <button id="modalCloseBtn" class="iconBtn" type="button" aria-label="关闭查看">关闭</button>
        </div>
        <div class="modal__body">
          <img id="modalImg" class="modal__img" alt="" />
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
